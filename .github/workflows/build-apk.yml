name: Build Bubatz FM APK

on:
  workflow_dispatch:
  push:
    paths:
      - "BubatzFM_v0.13_android_project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android Platform 35 installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Projekt entpacken
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q BubatzFM-project.zip -d build-src

      - name: APK bauen
        working-directory: build-src
        run: gradle --no-daemon assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Bubatz-FM-debug-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
